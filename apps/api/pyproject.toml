[project]
name = "piklove-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115","uvicorn[standard]>=0.30","pydantic-settings>=2.5","sqlalchemy[asyncio]>=2.0","asyncpg>=0.29","aiosqlite>=0.20","alembic>=1.13","redis>=5.0","httpx>=0.27","openai>=1.50","python-multipart>=0.0.9"]
[project.optional-dependencies]
dev = ["pytest>=8","pytest-asyncio>=0.24","ruff>=0.6"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
ignore = ["E501", "E701", "E702", "F403", "F405"]
