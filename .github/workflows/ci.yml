name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: piklove_test
          POSTGRES_USER: piklove
          POSTGRES_PASSWORD: piklove
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U piklove -d piklove_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Migration round-trip
        run: |
          alembic upgrade head
          python - <<'PY'
          import os
          from alembic.config import Config
          from alembic.runtime.migration import MigrationContext
          from alembic.script import ScriptDirectory
          from sqlalchemy import create_engine

          config = Config("alembic.ini")
          script = ScriptDirectory.from_config(config)
          url = os.environ["DATABASE_URL"].replace("+asyncpg", "")
          engine = create_engine(url)
          with engine.connect() as connection:
              current = MigrationContext.configure(connection).get_current_heads()
          print("SCRIPT_HEADS:", script.get_heads())
          print("DB_HEADS:", current)
          print("0002_PARENT:", script.get_revision("0002").down_revision)
          PY
          alembic current --check-heads
          alembic downgrade base
        env:
          DATABASE_URL: postgresql+asyncpg://piklove:piklove@localhost:5432/piklove_test
      - name: Tests
        run: python -m pytest tests/ -q
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://piklove:piklove@localhost:5432/piklove_test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
          NEXT_TELEMETRY_DISABLED: "1"
