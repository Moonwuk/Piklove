name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: piklove_test
          POSTGRES_USER: piklove
          POSTGRES_PASSWORD: piklove
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U piklove -d piklove_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Migration round-trip
        run: |
          alembic upgrade head
          alembic current --check-heads
          alembic check
          alembic downgrade base
        env:
          DATABASE_URL: postgresql+asyncpg://piklove:piklove@localhost:5432/piklove_test
      - name: Tests
        run: python -m pytest tests/ -q
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://piklove:piklove@localhost:5432/piklove_test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
          NEXT_TELEMETRY_DISABLED: "1"

  deployment-package:
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: bash -n scripts/*.sh
      - name: Prepare isolated smoke environment
        run: |
          cat > .env <<'EOF'
          ENVIRONMENT=development
          DATABASE_URL=postgresql+asyncpg://piklove:piklove@postgres:5432/piklove
          REDIS_URL=redis://redis:6379/0
          TELEGRAM_BOT_TOKEN=ci-telegram-token
          TELEGRAM_BOT_USERNAME=piklove_ci_bot
          TELEGRAM_WEBHOOK_SECRET=ci-webhook-secret
          OPENAI_API_KEY=ci-provider-key-not-used
          OPENAI_REPLY_MODEL=ci-reply-model
          OPENAI_ANALYSIS_MODEL=ci-analysis-model
          OPENAI_SUMMARY_MODEL=ci-summary-model
          OPENAI_STORE=false
          OPENAI_TIMEOUT_SECONDS=5
          OPENAI_MAX_RETRIES=0
          SESSION_SECRET=ci-session-secret-longer-than-32-characters
          WEB_ORIGIN=http://localhost:3000
          NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
          WEBHOOK_URL=
          COOKIE_SECURE=false
          COOKIE_SAMESITE=lax
          INIT_DATA_MAX_AGE_SECONDS=300
          RAW_MESSAGE_RETENTION_DAYS=30
          RETENTION_SWEEP_INTERVAL_SECONDS=3600
          AI_RECENT_MESSAGES_LIMIT=20
          GENERATION_TTL_SECONDS=900
          FREE_GENERATIONS=20
          PRO_MONTHLY_GENERATIONS=1000
          ENABLE_BILLING=false
          ENABLE_SUMMARIES=false
          ENABLE_MEMORY_EXTRACTION=false
          ENABLE_EDIT_BEFORE_SEND=true
          EOF
      - name: Compose configuration
        run: docker compose config >/dev/null
      - name: Build production containers
        run: docker compose build
      - name: Run isolated product smoke
        run: ./scripts/beta-test.sh
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Stop isolated stack
        if: always()
        run: docker compose down -v --remove-orphans
