services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: piklove, POSTGRES_USER: piklove, POSTGRES_PASSWORD: piklove }
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      { test: [CMD-SHELL, pg_isready -U piklove], interval: 5s, timeout: 3s, retries: 10 }
  redis:
    image: redis:7-alpine
    healthcheck: { test: [CMD, redis-cli, ping], interval: 5s, timeout: 3s, retries: 10 }
  api:
    build: ./apps/api
    env_file: .env
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      {
        test: [CMD, python, -c, "import urllib.request;urllib.request.urlopen('http://localhost:8000/health/live')"],
        interval: 10s,
        timeout: 3s,
        retries: 10,
      }
  web:
    build:
      context: ./apps/web
      args: { NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1 }
    environment: { NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1 }
    ports: ["3000:3000"]
    depends_on:
      api: { condition: service_healthy }
volumes: { postgres_data: {} }